<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KPlayground - Misje na Placu Zabaw</title>
  <link rel="stylesheet" href="assets/css/main.css">
  
  <style>
    /* Panel logów błędów na samym dole ekranu */
    #error-console {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(211, 47, 47, 0.95);
      color: white; padding: 10px 15px;
      font-family: monospace; font-size: 11px;
      z-index: 99999; max-height: 160px; overflow-y: auto;
      display: none; text-align: left;
      border-top: 2px solid #ff5252;
    }
    #error-console h4 {
      margin: 0 0 4px 0; font-size: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.4);
      padding-bottom: 2px;
    }

    /* Podstawowe animacje */
    @keyframes heroJump {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px) scale(1.05); }
    }
    .anim-bounce { animation: heroJump 0.8s ease-in-out infinite; }

    .fade-in { animation: fadeIn 0.3s ease-out forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Główny kontener aplikacji -->
  <div id="app" style="padding-bottom: 50px;">
    <p style="text-align: center; margin-top: 3rem; color: #666;">Ładowanie aplikacji...</p>
  </div>

  <!-- Panel błędów na dole ekranu -->
  <div id="error-console">
    <h4>⚠️ Konsola Błędów (Debug):</h4>
    <div id="error-logs-content"></div>
  </div>

  <!-- Globalny system przechwytywania błędów -->
  <script>
    window.showAppError = function(msg, file, line) {
      const consoleEl = document.getElementById('error-console');
      const contentEl = document.getElementById('error-logs-content');
      if (consoleEl && contentEl) {
        consoleEl.style.display = 'block';
        const time = new Date().toLocaleTimeString();
        const fileNameShort = file ? file.split('/').pop() : 'system';
        contentEl.innerHTML += `[${time}] ${msg} (${fileNameShort}:${line || 0})<br>`;
      }
    };

    window.addEventListener('error', function(event) {
      window.showAppError(event.message, event.filename, event.lineno);
    });

    window.addEventListener('unhandledrejection', function(event) {
      window.showAppError(event.reason ? event.reason.toString() : 'Nieobsługiwany błąd asynchroniczny');
    });
  </script>

  <!-- Inicjalizator aplikacji -->
  <script type="module">
    import { initApp } from './assets/js/state.js';
    try {
      initApp();
    } catch (err) {
      window.showAppError(err.message, 'index.html', 0);
    }
  </script>

</body>
</html>
